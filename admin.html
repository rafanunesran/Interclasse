<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Camisetas Interclasse</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topo">
  <h1>👕 Camisetas Interclasse</h1>
  <nav>
    <a href="index.html">Início</a>
  </nav>
</header>

<main>
  <div class="card" id="cardLogin">
    <h2>Login do administrador</h2>
    <p>Entre com o e-mail e a senha da conta administradora.</p>
    <form id="formLogin">
      <label for="emailAdmin">E-mail</label>
      <input type="email" id="emailAdmin" required autocomplete="username" />

      <label for="senhaAdmin">Senha</label>
      <input type="password" id="senhaAdmin" required autocomplete="current-password" />

      <button type="submit" class="primario">Entrar</button>
    </form>
    <p id="msgLogin" class="oculto"></p>
  </div>
</main>

<p class="rodape">Sistema de controle de pedidos de camiseta — Interclasse</p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth-admin.js"></script>
<script src="js/login.js"></script>
</body>
</html>
