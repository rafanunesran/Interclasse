<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Camisetas Interclasse</title>
<link rel="stylesheet" href="css/style.css?v=20260901a" />
</head>
<body>

<header class="topo">
  <h1>👕 Camisetas Interclasse</h1>
  <nav>
    <a href="index.html">Início</a>
  </nav>
</header>

<main>
  <div class="card">
    <h2 id="tituloLista">Times</h2>
    <p id="subtituloLista">Toque no seu time para cadastrar a lista de camisetas.</p>
    <p id="voltarClientes" class="oculto"><a href="index.html">← Todos os clientes</a></p>
    <p id="carregando">Carregando...</p>
    <div id="listaTimes" class="grade-times"></div>
  </div>
</main>

<!-- Carrinho: aparece aqui também, porque ele vale para o site inteiro —
     um responsável pode juntar camisetas de times diferentes. -->
<div id="barraCarrinho" class="barra-carrinho oculto" role="region" aria-label="Carrinho de pagamento">
  <div class="carrinho-info">
    <span class="carrinho-icone" aria-hidden="true">🛒</span>
    <span id="carrinhoResumo">Carrinho vazio</span>
  </div>
  <div class="carrinho-acoes">
    <button type="button" id="btnEsvaziarCarrinho" class="secundario">Esvaziar</button>
    <button type="button" id="btnPagarCarrinho" class="primario">Pagar</button>
  </div>
</div>

<p class="rodape">Sistema de controle de pedidos de camiseta — Interclasse</p>
<p class="rodape-admin"><a href="admin.html" class="link-admin">Área administrativa</a></p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js?v=20260901a"></script>
<script src="js/home.js?v=20260901a"></script>
</body>
</html>
