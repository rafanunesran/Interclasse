<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Camisetas Interclasse</title>
<link rel="stylesheet" href="css/style.css?v=20260927a" />
</head>
<body>

<header class="topo">
  <h1>👕 Camisetas Interclasse</h1>
  <nav>
    <a href="index.html">Início</a>
  </nav>
</header>

<main class="loja">
  <section class="loja-hero">
    <h2 id="tituloLista">Escolha o seu time</h2>
    <p id="subtituloLista">Encontre o pedido da sua turma, confira a lista e pague as camisetas.</p>
  </section>

  <div class="loja-filtros">
    <input type="search" id="buscaLoja" class="loja-busca" placeholder="🔎 Buscar time ou escola" autocomplete="off" aria-label="Buscar time ou escola" />
    <div id="filtroClientesLoja" class="chips-filtro oculto" role="group" aria-label="Filtrar por escola ou cliente"></div>
  </div>

  <p id="carregando" class="pix-ajuda">Carregando...</p>
  <p id="resumoLoja" class="loja-resumo oculto"></p>
  <div id="listaTimes" class="grade-loja"></div>
</main>

<!-- Carrinho: aparece aqui também, porque ele vale para o site inteiro —
     um responsável pode juntar camisetas de times diferentes. -->
<div id="barraCarrinho" class="barra-carrinho oculto" role="region" aria-label="Carrinho de pagamento">
  <div class="carrinho-info">
    <span class="carrinho-icone" aria-hidden="true">🛒</span>
    <span id="carrinhoResumo">Carrinho vazio</span>
  </div>
  <div class="carrinho-acoes">
    <button type="button" id="btnEsvaziarCarrinho" class="secundario">Esvaziar</button>
    <button type="button" id="btnPagarCarrinho" class="primario">Pagar</button>
  </div>
</div>

<p class="rodape">Sistema de controle de pedidos de camiseta — Interclasse</p>
<p class="rodape-admin"><a href="admin.html" class="link-admin">Área administrativa</a></p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js?v=20260927a"></script>
<script src="js/home.js?v=20260927a"></script>
</body>
</html>
