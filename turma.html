<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redirecionando… — Camisetas Interclasse</title>
<link rel="stylesheet" href="css/style.css?v=20260901a" />
<!--
  Endereço antigo da página do pedido: o que hoje se chama "time" antes se
  chamava "turma". Os links já compartilhados com os representantes continuam
  funcionando: esta página só repassa o ?id= para time.html.
-->
</head>
<body>

<header class="topo">
  <h1>👕 Camisetas Interclasse</h1>
  <nav>
    <a href="index.html">Início</a>
  </nav>
</header>

<main>
  <div class="card">
    <h2>Endereço novo</h2>
    <p>Esta página passou a se chamar <strong>time.html</strong>. Estamos levando você para lá…</p>
    <p><a id="linkNovo" href="index.html">Ir agora</a></p>
  </div>
</main>

<p class="rodape">Sistema de controle de pedidos de camiseta — Interclasse</p>

<script>
  // Repassa o ?id= (e qualquer outro parâmetro) para o endereço novo.
  var busca = window.location.search || "";
  var destino = "time.html" + busca;
  var link = document.getElementById("linkNovo");
  if (link) link.href = destino;
  window.location.replace(destino);
</script>
</body>
</html>
